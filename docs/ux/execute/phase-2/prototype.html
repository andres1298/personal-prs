<script>
/* ---------- Plates: same rules as src/lib/plates.js (combinations, recommended option, ladder) ---------- */
const ALL_PLATES = [55, 45, 35, 25, 15, 10, 5, 2.5];
const PLATE_STYLE = { 55: ['--red', 100], 45: ['--blue', 100], 35: ['--amber', 92], 25: ['--green', 84], 15: ['--purple', 74], 10: ['--p10', 64], 5: ['--p5', 48], 2.5: ['--p25s', 38] };

const sum = (l) => l.reduce((t, p) => t + p, 0);
const round5 = (x) => Math.round(x / 5) * 5;
function subtract(a, b) { const r = [...a]; for (const p of b) { const i = r.indexOf(p); if (i >= 0) r.splice(i, 1); } return r; }

  const plates = [...available].sort((a, b) => b - a); const out = [];
  (function dfs(rem, start, cur) {
    if (out.length > 4000) return;
    if (Math.abs(rem) < 1e-6) { out.push([...cur]); return; }
    if (cur.length >= 8) return;
    for (let i = start; i < plates.length; i++) if (plates[i] <= rem + 1e-6) { cur.push(plates[i]); dfs(rem - plates[i], i, cur); cur.pop(); }
  })(perSide, 0, []);
  return out;
}
function plateOptions(target, { bar, plates }) {
  const perSide = (target - bar) / 2;
  if (perSide <= 0) return [{ plates: [] }];
  const byTop = new Map();
  for (const c of combos(perSide, plates)) { const cur = byTop.get(c[0]); if (!cur || c.length < cur.length) byTop.set(c[0], c); }
  const all = [...byTop.values()]; if (!all.length) return [];
  const pref = (c) => (c[0] === 45 ? 0 : 1);
  const rec = [...all].sort((a, b) => a.length - b.length || pref(a) - pref(b) || b[0] - a[0])[0];
  return [rec, ...all.filter((c) => c !== rec).sort((a, b) => b[0] - a[0])].slice(0, 4).map((plates) => ({ plates }));
}
const SCHEME = [[40, 5], [55, 5], [70, 3], [80, 2], [90, 1]];
function stepNote(prev, plates) {
  const rem = subtract(prev, plates), add = subtract(plates, prev), list = (x) => x.map(fmt).join(' + ');
  if (!plates.length) return 'Barra sola'; if (!prev.length) return `Pon ${list(add)}`;
  if (!rem.length) return `Agrega ${list(add)}`; if (!add.length) return `Quita ${list(rem)}`;
  return `Quita ${list(rem)} · pon ${list(add)}`;
}
function buildLadder(final, { bar, plates }) {
  const goal = bar + 2 * sum(final);
  if (!final.length) return [{ total: bar, reps: 10, plates: [], note: 'Barra sola' }];
  const minGap = Math.max(10, goal * 0.06); const sets = []; let prev = bar;
  for (const [pct, reps] of SCHEME) {
    const perSide = Math.round((goal * pct / 100 - bar) / 2 / 5) * 5; const total = bar + 2 * perSide;

    const opts = [];

      const side = perSide + shift; if (side <= 0) continue;
      const cs = combos(side, clean);
      for (const c of cs.length ? cs : combos(side, plates)) opts.push({ plates: c, total: bar + 2 * side, cost: (shift ? 2.5 : 0) + c.length * 0.1 });

  const change = (f, t) => 2 * subtract(f, t).length + subtract(t, f).length;
  let paths = levels[0].map((n) => ({ cost: n.cost, nodes: [n] }));
  for (const level of levels.slice(1)) {
    paths = level.map((node) => {
      let best = null;
      for (const p of paths) { const last = p.nodes.at(-1); if (node.total - last.total < Math.max(10, minGap * .75)) continue;

}

function parseQuery(text) {
  const t = text.trim().toLowerCase().replace(/%/g, ' ');
  const rm = t.match(/\b([135])\s*rm\b/); const rest = t.replace(/\b[135]\s*rm\b/, ' ');
  const nums = [...rest.matchAll(/\d+([.,]\d+)?/g)].map((m) => parseFloat(m[0].replace(',', '.')));
  const words = rest.replace(/\d+([.,]\d+)?/g, ' ').replace(/\s+/g, ' ').trim();
  if (!words && nums.length >= 1 && nums[0] > 100) return { free: nums[0], pct: nums[1] };
  return { words, pct: nums.find((n) => n >= 30 && n <= 120), rm: rm ? Number(rm[1]) : undefined };
}
function search(words) {
  if (!words) return [];
  const w = words.toLowerCase();
  const score = (m) => {
    const n = m.name.toLowerCase();
    if (ALIASES[w] === m.name) return 0; if (n === w) return 0; if (n.startsWith(w)) return 1;
    if (n.split(/[\s-]+/).some((p) => p.startsWith(w))) return 2; if (initials(m.name).startsWith(w.replace(/\s/g, ''))) return 3;
    if (w.split(' ').every((p) => n.includes(p))) return 4; return 99;
  };
  return MOVES.map((m) => [score(m), m]).filter(([s]) => s < 99).sort((a, b) => a[0] - b[0]).map(([, m]) => m);
}

    body = `<div class="list">${ladder.map((st, i) => `<button class="step" data-wstep="${i}" aria-pressed="${sheet.done.includes(i)}"><span class="chk">${icon('check', 'style="width:15px;height:15px;stroke-width:3.2"')}</span>
      <span><b class="num">${st.total}</b><small class="num">${Math.round(st.total / cur.base * 100)} % · ${st.reps ? '×' + st.reps : 'objetivo'}</small></span>
      <span class="note">${st.plates.length ? `<span class="mini">${st.plates.map((p) => `<i style="--pc:var(${PLATE_STYLE[p][0]});height:${Math.round(PLATE_STYLE[p][1] * .26)}px"></i>`).join('')}</span>` : ''}${esc(st.note)}</span></button>`).join('')}</div>`;
  } else if (sheet.kind === 'plus') {
    title = 'Agregar';
    body = `<div class="list"><button class="item" data-toast="Abre el formulario de PR con ${esc(cur.title)} elegido"><span class="grow"><b>Registrar PR</b><small>${esc(cur.title)}</small></span></button>
      <button class="item" data-toast="Abre «Nuevo movimiento»"><span class="grow"><b>Nuevo movimiento</b><small>En una categoría tuya o del catálogo</small></span></button></div>`;
  } else if (sheet.kind === 'detail') {
    title = sheet.name;
    body = `${resultHtml(current())}${barCardHtml(current())}<div class="steppers"><button class="step-btn num" data-step="-5">−5 %</button><button class="step-btn num" data-step="5">+5 %</button></div>`;
  }
  return `<div class="sheet-root"><div class="backdrop" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-bar"><b>${esc(title)}</b><button class="text-btn" data-close>Listo</button></div><div class="sheet-body">${body}</div></div></div>`;
}

function render() {
  const app = document.getElementById('app');
  const focusId = document.activeElement?.id; const caret = document.activeElement?.selectionStart;
  const tableScroll = document.getElementById('table')?.scrollTop;
  app.innerHTML = (proposal === 'a' ? viewA() : proposal === 'b' ? viewB() : viewC()) + sheetHtml() + (toastText ? `<div class="toast" role="status">${esc(toastText)}</div>` : '');
  document.getElementById('sw-name').textContent = { a: 'A · Barra', b: 'B · Tabla de cargas', c: 'C · Pizarrón' }[proposal];
  document.querySelectorAll('#sw button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.p === proposal));
  const sel = document.querySelector('.pct[aria-pressed="true"]'); sel?.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (tableScroll != null && document.getElementById('table')) document.getElementById('table').scrollTop = tableScroll;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
}
let toastTimer;
function toast(text) { toastText = text; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastText = ''; render(); }, 1800); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-close]'); if (!t) return;
  const d = t.dataset;
  if (d.p) { proposal = d.p; sheet = null; try { history.replaceState(null, '', '#' + d.p); } catch {} render(); return; }
  if ('close' in d) { sheet = null; render(); return; }
  if (d.pct) { S.pct = Number(d.pct); S.lastPct[S.move] = S.pct; save(); render(); return; }
  if (d.move) { selectMove(d.move); render(); return; }
  if (d.rm) { S.rm = Number(d.rm); save(); render(); return; }
  if (d.step) { S.pct = Math.min(100, Math.max(30, S.pct + Number(d.step))); save(); render(); return; }
  if (d.open === 'search') { sheet = { kind: 'search', q: '' }; render(); document.getElementById('sq')?.focus(); return; }
  if (d.open) { sheet = { kind: d.open }; render(); return; }
  if (d.pick) { selectMove(d.pick, d.ppct ? Number(d.ppct) : undefined); sheet = null; render(); return; }
  if (d.free) { S.free = Number(d.free); S.pct = Number(d.fpct); save(); sheet = null; render(); return; }
  if (d.detail) { selectMove(d.detail); sheet = { kind: 'detail', name: d.detail }; render(); return; }
  if (d.bar) { S.bar = Number(d.bar); save(); render(); return; }
  if (d.plate) { const p = Number(d.plate); S.plates = S.plates.includes(p) ? S.plates.filter((x) => x !== p) : [...S.plates, p]; save(); render(); return; }
  if (d.nobar) { const n = d.nobar; S.noBar = S.noBar.includes(n) ? S.noBar.filter((x) => x !== n) : [...S.noBar, n]; save(); render(); return; }
  if (d.wstep) { const i = Number(d.wstep); sheet.done = sheet.done.includes(i) ? sheet.done.filter((x) => x !== i) : [...sheet.done, i]; render(); return; }
  if (d.cmd) { runCommand(d.cmd, true); return; }
  if (d.toast) { toast(d.toast); return; }
});
function runCommand(text, commit) {
  const q = parseQuery(text);
  if (q.free) { S.free = q.free; if (q.pct) S.pct = q.pct; save(); render(); return; }
  const m = search(q.words)[0]; if (!m) return;
  selectMove(m.name, q.pct); if (q.rm && m.rms?.[q.rm]) S.rm = q.rm;
  if (commit) { const line = `${m.name} ${S.pct} %`; S.history = [line, ...S.history.filter((h) => h !== line)].slice(0, 6); }
  save(); render();
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.query = e.target.value; const q = parseQuery(S.query); if (q.pct) S.pct = q.pct; render(); }
  if (e.target.id === 'sq') { sheet.q = e.target.value; render(); }
  if (e.target.id === 'cmd') { if (e.target.value.trim()) runCommand(e.target.value, false); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'cmd') { runCommand(e.target.value, true); e.target.value = ''; e.target.blur(); }
  if (e.target.id === 'sq') { const first = document.querySelector('[data-pick], [data-free]'); first?.click(); }
  if (e.target.id === 'q') e.target.blur();
});

const params = new URLSearchParams(location.search);
if (params.has('shot')) {
  document.body.classList.add('shot');
  document.documentElement.style.setProperty('--sim-top', (params.get('top') || 0) + 'px');
  document.documentElement.style.setProperty('--sim-bottom', (params.get('bottom') || 0) + 'px');
  S = { ...DEFAULT };
  if (params.get('move')) selectMove(params.get('move'));
  if (params.get('pct')) S.pct = Number(params.get('pct'));
  if (params.get('sheet')) sheet = { kind: params.get('sheet'), q: params.get('q') || '', name: S.move };
  if (params.get('query')) S.query = params.get('query');
}
const fromHash = () => { const h = location.hash.slice(1); if (['a', 'b', 'c'].includes(h)) proposal = h; };
fromHash(); if (params.get('p')) proposal = params.get('p');
window.addEventListener('hashchange', () => { fromHash(); sheet = null; render(); });
render();
</script>
