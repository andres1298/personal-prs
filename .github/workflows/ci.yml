name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; it never pushes, comments or deploys.
permissions:
  contents: read

# Superseded pull request runs are cancelled; every push to main runs to completion so each
# merged commit gets its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the whitespace check reach every commit included in a push.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm test

      - name: Validate the Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Check whitespace
        # On pull requests HEAD is the merge commit, so HEAD^ is the base branch. On pushes the
        # check starts at the previous tip of the branch so every pushed commit is covered, and
        # falls back to HEAD^ when that commit is unknown (new branch or force push). The second
        # check covers files changed by install or build.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^
          if [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          git diff --check "$base" HEAD
          git diff --check

      - name: Audit production dependencies
        # Informational: new advisories should not block unrelated changes. Dependabot opens fixes.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
